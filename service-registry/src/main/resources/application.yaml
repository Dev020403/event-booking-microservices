server:
  port: 8761

spring:
  application:
    name: service-registry

eureka:
  client:
    # This IS the registry, so it shouldn't register itself as a client
    register-with-eureka: false
    fetch-registry: false
  server:
    # Disable self-preservation in dev so stale/down instances get evicted quickly.
    # Turn this back on (or leave default true) in a production-like setup.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000