server:
  port: 8087

spring:
  application:
    name: ai-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/event-booking-app}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mvc:
    async:
      request-timeout: 120s
  ai:
    model:
      chat: openai
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: ${GROQ_MODEL:openai/gpt-oss-120b}
        replay-reasoning-content: false
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
          event-service:
            url: ${EVENT_SERVICE_URL:http://localhost:8082}
          inventory-service:
            url: ${INVENTORY_SERVICE_URL:http://localhost:8083}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

eventmate:
  ai:
    memory-window-size: 20
    stream-idle-timeout: 60s
    system-prompt: >
      You are EventMate AI, an assistant for an event booking platform.
      Always use the provided tools to look up events, prices and availability.
      Never invent events, prices or seat counts. For relative dates such as
      'tomorrow' or 'this weekend', call getCurrentDate first. If a tool returns
      nothing or fails, say so plainly. Be concise.
