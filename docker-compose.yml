services:

  # ==========================================
  # PostgreSQL
  # ==========================================
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # redis
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ==========================================
  # Floci (local AWS emulator, endpoint http://localhost:4566)
  # ==========================================
  floci:
    image: floci/floci:2.3.0
    container_name: floci
    restart: unless-stopped

    # Root is required to use the Docker socket, which Floci needs to start
    # container-backed services (RDS, ElastiCache, MSK, ECS, EKS, Lambda).
    user: root

    environment:
      FLOCI_STORAGE_MODE: hybrid

    ports:
      - "4566:4566"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci_data:/app/data

  # ==========================================
  # Zookeeper
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"


  # ==========================================
  # Kafka
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: unless-stopped

    depends_on:
      - zookeeper

    ports:
      - "9094:9094"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"


  # ==========================================
  # Eureka Service Registry
  # ==========================================
  service-registry:
    build:
      context: ./service-registry
      dockerfile: Dockerfile

    container_name: service-registry
    restart: unless-stopped

    ports:
      - "8761:8761"


  # ==========================================
  # API Gateway
  # ==========================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile

    container_name: api-gateway
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis

    depends_on:
      - service-registry
      - redis


  # ==========================================
  # User Service
  # ==========================================
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile

    container_name: user-service
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin123}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/

      JWT_SECRET: ${JWT_SECRET:-cGxlYXNlLXJlcGxhY2UtdGhpcy13aXRoLWEtc3Ryb25nLXNlY3JldC1rZXk=}
      JWT_ACCESS_EXPIRY_MS: ${JWT_ACCESS_EXPIRY_MS:-900000}
      JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS:-604800000}

    depends_on:
      - postgres-db
      - service-registry

  # ==========================================
  # Event Service
  # ==========================================
  event-service:
    build:
      context: ./event-service
      dockerfile: Dockerfile

    container_name: event-service
    restart: unless-stopped

    ports:
      - "8082:8082"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/event_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin123}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JWT_SECRET: ${JWT_SECRET:-cGxlYXNlLXJlcGxhY2UtdGhpcy13aXRoLWEtc3Ryb25nLXNlY3JldC1rZXk=}
      JWT_ACCESS_EXPIRY_MS: ${JWT_ACCESS_EXPIRY_MS:-900000}
      JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS:-604800000}

    depends_on:
      - postgres-db
      - kafka
      - service-registry

  # ==========================================
  # Inventory Service
  # ==========================================
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile

    container_name: inventory-service
    restart: unless-stopped

    ports:
      - "8083:8083"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin123}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JWT_SECRET: ${JWT_SECRET:-cGxlYXNlLXJlcGxhY2UtdGhpcy13aXRoLWEtc3Ryb25nLXNlY3JldC1rZXk=}
      JWT_ACCESS_EXPIRY_MS: ${JWT_ACCESS_EXPIRY_MS:-900000}
      JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS:-604800000}

    depends_on:
      - postgres-db
      - kafka
      - service-registry

  # ==========================================
  # Payment Service
  # ==========================================
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile

    container_name: payment-service
    restart: unless-stopped

    ports:
      - "8084:8084"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin123}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JWT_SECRET: ${JWT_SECRET:-cGxlYXNlLXJlcGxhY2UtdGhpcy13aXRoLWEtc3Ryb25nLXNlY3JldC1rZXk=}
      JWT_ACCESS_EXPIRY_MS: ${JWT_ACCESS_EXPIRY_MS:-900000}
      JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS:-604800000}

    depends_on:
      - postgres-db
      - kafka
      - service-registry

  # ==========================================
  # Booking Service
  # ==========================================
  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile

    container_name: booking-service
    restart: unless-stopped

    ports:
      - "8085:8085"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/booking_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin123}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JWT_SECRET: ${JWT_SECRET:-cGxlYXNlLXJlcGxhY2UtdGhpcy13aXRoLWEtc3Ryb25nLXNlY3JldC1rZXk=}
      JWT_ACCESS_EXPIRY_MS: ${JWT_ACCESS_EXPIRY_MS:-900000}
      JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS:-604800000}

    depends_on:
      - postgres-db
      - kafka
      - service-registry

  # ==========================================
  # Mailpit (local SMTP sink + web UI at http://localhost:8025)
  # ==========================================
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: mailpit
    restart: unless-stopped

    ports:
      - "1025:1025"
      - "8025:8025"

  # ==========================================
  # Notification Service
  # ==========================================
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile

    container_name: notification-service
    restart: unless-stopped

    ports:
      - "8086:8086"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin123}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_SMTP_STARTTLS: ${SPRING_MAIL_SMTP_STARTTLS:-false}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-no-reply@event-booking.local}

      JWT_SECRET: ${JWT_SECRET:-cGxlYXNlLXJlcGxhY2UtdGhpcy13aXRoLWEtc3Ryb25nLXNlY3JldC1rZXk=}

    depends_on:
      - postgres-db
      - kafka
      - service-registry
      - mailpit

  # ==========================================
  # AI Service
  # ==========================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile

    container_name: ai-service
    restart: unless-stopped

    ports:
      - "8087:8087"

    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://ai-postgres:5432/ai_service_db
      SPRING_DATASOURCE_USERNAME: ${AI_POSTGRES_USER:-ai_user}
      SPRING_DATASOURCE_PASSWORD: ${AI_POSTGRES_PASSWORD:-change_this_password}

      # Groq
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}

      # Ollama running on your Windows host
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text

      # Eureka
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/

      # Other microservices
      EVENT_SERVICE_URL: http://event-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      BOOKING_SERVICE_URL: http://booking-service:8085

      # JWT - use the same secret as your other services
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      ai-postgres:
        condition: service_healthy
      service-registry:
        condition: service_started

  # ==========================================
  # AI Service PostgreSQL + pgvector
  # ==========================================
  ai-postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_service_db
      POSTGRES_USER: ${AI_POSTGRES_USER:-ai_user}
      POSTGRES_PASSWORD: ${AI_POSTGRES_PASSWORD:-change_this_password}

    ports:
      - "5433:5432"

    volumes:
      - ai_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AI_POSTGRES_USER:-ai_user} -d ai_service_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
  floci_data:
  ai_postgres_data: